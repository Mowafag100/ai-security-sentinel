<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️ AI Security Sentinel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        <header class="border-b border-gray-800 pb-4">
            <h1 class="text-3xl font-bold text-blue-500">🛡️ AI Security Sentinel</h1>
            <p class="text-gray-400 text-sm mt-1">مدقق حسابات متطور يعمل بالذكاء الاصطناعي مدعوم من TinyLlama</p>
        </header>

        <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 space-y-4 shadow-xl">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">مسح المستودع المحلي:</label>
                <div class="flex gap-2">
                    <input type="text" id="pathInput" placeholder="allowed_targets/vulnerable_app.py" class="flex-1 bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm text-emerald-400 focus:outline-none focus:border-blue-500 font-mono">
                    <button onclick="runPathAudit()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg text-sm font-medium transition-colors">تشغيل تدقيق المسار</button>
                </div>
            </div>

            <div class="border-t border-gray-800 pt-4">
                <label class="block text-sm font-medium text-gray-300 mb-2">قم بتحميل الملف للتحليل:</label>
                <div class="flex gap-2">
                    <input type="file" id="fileInput" class="flex-1 bg-gray-950 border border-gray-800 rounded-lg px-3 py-1.5 text-sm text-gray-400 file:ml-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-blue-900/50 file:text-blue-400 hover:file:bg-blue-900">
                    <button onclick="uploadAndAnalyze()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg text-sm font-medium transition-colors">التحميل والتحليل</button>
                </div>
            </div>
        </div>

        <div id="resultPanel" class="hidden bg-gray-900 border border-gray-800 rounded-xl p-5 shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                <h2 id="issuesCount" class="text-lg font-bold text-yellow-500">تم رصد 0 مشكلات أمنية</h2>
                <span id="statusBadge" class="text-xs font-mono bg-blue-950 text-blue-400 border border-blue-800 px-2 py-0.5 rounded-full"></span>
            </div>

            <div>
                <h3 class="text-md font-bold text-gray-300 mb-3">📋 خطة معالجة الذكاء الاصطناعي والتقرير المهيكل:</h3>
                <div id="issuesContainer" class="space-y-4">
                    </div>
            </div>
        </div>
    </div>

    <script>
        function displayResults(data) {
            const panel = document.getElementById('resultPanel');
            const countText = document.getElementById('issuesCount');
            const badge = document.getElementById('statusBadge');
            const container = document.getElementById('issuesContainer');

            panel.classList.remove('hidden');
            countText.innerText = `تم رصد ${data.raw_issues_count || 0} مشكلات أمنية`;
            
            // قراءة البنية الهيكلية لـ Pydantic
            const aiAnalysis = data.ai_analysis || {};
            badge.innerText = `Status: ${aiAnalysis.status || 'unknown'}`;
            container.innerHTML = '';

            if (aiAnalysis.issues && aiAnalysis.issues.length > 0) {
                aiAnalysis.issues.forEach(issue => {
                    const card = document.createElement('div');
                    card.className = 'bg-gray-950 border border-red-900/40 rounded-lg p-4 space-y-2';
                    card.innerHTML = `
                        <div class="flex justify-between items-center border-b border-gray-900 pb-1.5 mb-2">
                            <span class="text-red-400 font-mono font-bold text-xs bg-red-950/50 px-2 py-0.5 rounded border border-red-900/60">${issue.cwe_id}</span>
                            <span class="text-xs font-bold text-yellow-500">Severity: ${issue.severity}</span>
                        </div>
                        <p class="text-sm text-gray-300"><span class="text-gray-500 font-mono">السطر ${issue.line_number || 'غير محدد'}:</span> ${issue.description}</p>
                        <div class="bg-blue-950/20 border border-blue-900/40 p-3 rounded mt-2">
                            <span class="block text-xs font-bold text-blue-400 mb-1">💡 خطة المعالجة البرمجية المقترحة:</span>
                            <code class="text-xs font-mono text-emerald-400 block whitespace-pre-wrap">${issue.remediation}</code>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } else {
                container.innerHTML = `<div class="text-sm text-gray-400 p-2">${typeof aiAnalysis === 'string' ? aiAnalysis : 'لم يتم توليد تفاصيل مهيكلة، تحقق من سياق أولاما.'}</div>`;
            }
        }

        async function runPathAudit() {
            const path = document.getElementById('pathInput').value;
            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: path })
                });
                const data = await response.json();
                displayResults(data);
            } catch (e) { alert('خطأ أثناء الفحص: ' + e); }
        }

        async function uploadAndAnalyze() {
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) { alert('الرجاء اختيار ملف أولاً'); return; }
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch('/upload-analyze', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                displayResults(data);
            } catch (e) { alert('خطأ أثناء الرفع والتحليل: ' + e); }
        }
    </script>
</body>
</html>
